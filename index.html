<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dot Email Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EEF3F2;
    --panel: #FFFFFF;
    --ink: #17302F;
    --muted: #5F7473;
    --line: #CBDAD8;
    --teal: #1F6F6B;
    --teal-dark: #164F4C;
    --dot: #E23B78;
    --ok: #1F7A4D;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
  }
  main { max-width: 640px; margin: 0 auto; padding: 40px 18px 64px; }
  h1 {
    font-size: clamp(2rem, 8vw, 3rem);
    line-height: 1.05;
    font-weight: 700;
    margin: 0 0 12px;
    letter-spacing: -0.02em;
  }
  h1 .d { color: var(--dot); }
  .lead { margin: 0 0 28px; color: var(--muted); max-width: 46ch; }

  .row { display: flex; gap: 10px; align-items: stretch; }
  .row input {
    flex: 1 1 auto;
    min-width: 0;
    font: 500 1rem "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    padding: 14px 14px;
    color: var(--ink);
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 10px;
    outline: none;
  }
  .row input:focus { border-color: var(--teal); }
  .row input::placeholder { color: #93A6A5; }

  button {
    font: 700 1rem "Bricolage Grotesque", system-ui, sans-serif;
    cursor: pointer;
    border: 0;
    border-radius: 10px;
  }
  button:focus-visible, input:focus-visible {
    outline: 3px solid var(--dot);
    outline-offset: 2px;
  }
  #gen { flex: 0 0 auto; padding: 0 20px; background: var(--teal); color: #fff; }
  #gen:hover { background: var(--teal-dark); }

  .opts {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    color: var(--muted);
    font-size: 0.92rem;
  }
  .opts input[type="number"] {
    width: 110px;
    font: 500 0.95rem "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    padding: 7px 9px;
    border: 2px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    color: var(--ink);
  }
  .opts input[type="number"]:focus { border-color: var(--teal); }
  .chk { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .chk input { width: 18px; height: 18px; accent-color: var(--teal); }
  li code i.tag { font-size: 1em; }
  #reset {
    margin-left: auto;
    padding: 8px 14px;
    background: #FDE8EF;
    color: #8B1B44;
    font-size: 0.9rem;
  }
  #reset:hover { background: #F9D3E1; }

  .msg { margin: 16px 0 0; padding: 10px 12px; border-radius: 8px; font-size: 0.93rem; display: none; }
  .msg.show { display: block; }
  .msg.err { background: #FDE8EF; color: #8B1B44; }
  .msg.note { background: #FFF4D6; color: #6B4E00; }

  #results { margin-top: 28px; display: none; }
  #results.show { display: block; }

  .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .bar h2 { margin: 0; font-size: 1.1rem; }
  .bar .tools { display: flex; gap: 8px; }
  .ghost { padding: 8px 12px; background: var(--panel); color: var(--teal-dark); border: 2px solid var(--line); font-size: 0.9rem; }
  .ghost:hover { border-color: var(--teal); }

  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 12px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; margin-bottom: 8px;
  }
  li code { font: 500 0.95rem "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; overflow-wrap: anywhere; }
  li code i { font-style: normal; font-weight: 700; color: var(--dot); font-size: 1.15em; padding: 0 1px; }
  li button { flex: 0 0 auto; padding: 6px 12px; background: #E3EEEC; color: var(--teal-dark); font-size: 0.85rem; }
  li button.done, .ghost.done { background: var(--ok); color: #fff; border-color: var(--ok); }

  #more { display: none; width: 100%; padding: 12px; background: var(--panel); color: var(--teal-dark); border: 2px solid var(--line); }
  #more.show { display: block; }
  #more:hover { border-color: var(--teal); }

  footer { margin-top: 36px; color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
<main>
  <h1>One email, many<span class="d">.</span>dotted<span class="d">.</span>versions</h1>
  <p class="lead">Enter a Gmail address and generate every custom version with dots. All of them land in the same inbox.</p>

  <div class="row">
    <input id="email" type="text" inputmode="email" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="yourname@gmail.com" aria-label="Email address">
    <button id="gen" type="button">Generate</button>
  </div>

  <div class="opts">
    <label for="limit">How many</label>
    <input id="limit" type="number" inputmode="numeric" min="1" max="100000" step="1" value="100">
    <label class="chk" for="plus"><input id="plus" type="checkbox" checked> Add +tag emails</label>
    <button id="reset" type="button">Reset</button>
  </div>

  <p id="msg" class="msg" role="status"></p>

  <section id="results" aria-live="polite">
    <div class="bar">
      <h2 id="count"></h2>
      <div class="tools">
        <button class="ghost" id="copyAll" type="button">Copy all</button>
        <button class="ghost" id="download" type="button">Download .txt</button>
      </div>
    </div>
    <ul id="list"></ul>
    <button id="more" type="button">Show more</button>
  </section>

  <footer>Dots and +tags work as aliases for Gmail (gmail.com / googlemail.com). Your emails stay saved on this device until you press Reset.</footer>
</main>

<script>
(function () {
  var MAX = 100000, BATCH = 200, KEY = "dotemail:v1";
  var $ = function (id) { return document.getElementById(id); };
  var emailEl = $("email"), limitEl = $("limit"), msgEl = $("msg");
  var resultsEl = $("results"), listEl = $("list"), countEl = $("count"), moreEl = $("more");
  var current = [], shown = 0, memoryStore = null;

  /* ---------- storage (falls back to memory if the browser blocks it) ---------- */
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return memoryStore; }
  }
  function save(state) {
    memoryStore = state;
    try { localStorage.setItem(KEY, JSON.stringify(state)); return true; }
    catch (e) { return false; }
  }
  function wipe() {
    memoryStore = null;
    try { localStorage.removeItem(KEY); } catch (e) {}
  }
  var state = { email: "", limit: 100, list: [], total: 0 };

  function persist() {
    var ok = save(state);
    if (!ok && state.list.length) {
      // list too big for storage: keep email + limit only
      save({ email: state.email, limit: state.limit, list: [], total: 0 });
      showMsg("Too many emails to keep saved. They will clear if you refresh, but you can press Generate again.", "note");
    }
  }

  /* ---------- messages ---------- */
  function showMsg(text, kind) { msgEl.textContent = text; msgEl.className = "msg show " + kind; }
  function clearMsg() { msgEl.className = "msg"; msgEl.textContent = ""; }

  /* ---------- generation ---------- */
  function build(chars, bits) {
    var out = "";
    for (var i = 0; i < chars.length; i++) {
      out += chars[i];
      if (i < bits.length && bits[i]) out += ".";
    }
    return out;
  }

  function variations(local, limit) {
    var chars = Array.from(local);
    var gaps = chars.length - 1;
    var res = [];
    if (gaps < 1) return { list: res, total: 0 };

    var total = gaps >= 40 ? Infinity : Math.pow(2, gaps) - 1;
    var g, bits;

    if (total <= limit) {
      for (var m = 1; m <= total; m++) {
        bits = [];
        for (g = 0; g < gaps; g++) bits.push(Math.floor(m / Math.pow(2, g)) % 2);
        res.push(build(chars, bits));
      }
    } else {
      var seen = new Set(), guard = 0;
      while (seen.size < limit && guard < limit * 50) {
        guard++;
        bits = [];
        var any = false;
        for (g = 0; g < gaps; g++) {
          var b = Math.random() < 0.5 ? 1 : 0;
          if (b) any = true;
          bits.push(b);
        }
        if (any) seen.add(build(chars, bits));
      }
      res = Array.from(seen);
    }
    return { list: res, total: total };
  }

  function fmtTotal(n) { return n === -2 ? "unlimited" : (n === Infinity || n < 0) ? "billions" : n.toLocaleString(); }

  /* ---------- clipboard ---------- */
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise(function (resolve, reject) {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy") ? resolve() : reject(); } catch (e) { reject(e); }
      document.body.removeChild(ta);
    });
  }
  function flash(btn, label) {
    var old = btn.textContent;
    btn.textContent = label;
    btn.classList.add("done");
    setTimeout(function () { btn.textContent = old; btn.classList.remove("done"); }, 1200);
  }

  /* ---------- rendering ---------- */
  function renderRow(addr) {
    var li = document.createElement("li");
    var code = document.createElement("code");
    var at = addr.lastIndexOf("@");
    var local = addr.slice(0, at), rest = addr.slice(at);
    var plus = local.indexOf("+");
    var head = plus >= 0 ? local.slice(0, plus) : local;
    head.split(/(\.)/).forEach(function (p) {
      if (p === ".") {
        var i = document.createElement("i");
        i.textContent = ".";
        code.appendChild(i);
      } else if (p) {
        code.appendChild(document.createTextNode(p));
      }
    });
    if (plus >= 0) {
      var t = document.createElement("i");
      t.className = "tag";
      t.textContent = local.slice(plus);
      code.appendChild(t);
    }
    code.appendChild(document.createTextNode(rest));
    var btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = "Copy";
    btn.addEventListener("click", function () {
      copyText(addr).then(function () { flash(btn, "Copied"); }, function () { flash(btn, "Failed"); });
    });
    li.appendChild(code);
    li.appendChild(btn);
    return li;
  }

  function renderMore() {
    var end = Math.min(shown + BATCH, current.length);
    var frag = document.createDocumentFragment();
    for (var i = shown; i < end; i++) frag.appendChild(renderRow(current[i]));
    listEl.appendChild(frag);
    shown = end;
    var left = current.length - shown;
    if (left > 0) {
      moreEl.textContent = "Show more (" + left.toLocaleString() + " left)";
      moreEl.className = "show";
    } else {
      moreEl.className = "";
    }
  }

  function renderAll() {
    listEl.textContent = "";
    shown = 0;
    if (!current.length) { resultsEl.className = ""; return; }
    countEl.textContent = state.total === -2 ? current.length.toLocaleString() + " emails" : current.length.toLocaleString() + " of " + fmtTotal(state.total) + " possible emails";
    resultsEl.className = "show";
    renderMore();
  }

  /* ---------- actions ---------- */
  function generate() {
    clearMsg();

    var raw = emailEl.value.trim().toLowerCase();
    var at = raw.lastIndexOf("@");
    if (at < 1 || at === raw.length - 1) {
      showMsg("Enter a full email address, like yourname@gmail.com.", "err");
      return;
    }
    var local = raw.slice(0, at).replace(/\./g, "").replace(/\+.*$/, "");
    var domain = raw.slice(at + 1);

    if (!/^[a-z0-9]+$/.test(local) || !/^[a-z0-9.-]+\.[a-z]{2,}$/.test(domain)) {
      showMsg("The email has characters that can't be used. Check it and try again.", "err");
      return;
    }
    var usePlus = $("plus").checked;
    if (local.length < 2 && !usePlus) {
      showMsg("The name before @ needs at least 2 characters to place a dot. Turn on +tag emails to continue.", "err");
      return;
    }

    var want = parseInt(limitEl.value, 10);
    if (!want || want < 1) {
      showMsg("Type how many emails you want, like 50, 100 or 1000.", "err");
      return;
    }
    var clamped = false;
    if (want > MAX) { want = MAX; clamped = true; limitEl.value = MAX; }

    var out = variations(local, want);
    var names = out.list;
    var total = out.total === Infinity ? -1 : out.total;
    if (usePlus) {
      total = -2;
      if (names.length < want) {
        var bases = [local].concat(out.list);
        var tag = 1;
        while (names.length < want) {
          for (var b = 0; b < bases.length && names.length < want; b++) names.push(bases[b] + "+" + tag);
          tag++;
        }
      }
    }
    current = names.map(function (v) { return v + "@" + domain; });

    state = {
      email: emailEl.value.trim(),
      limit: want,
      plus: usePlus,
      list: current,
      total: total
    };
    renderAll();
    persist();

    if (clamped) showMsg("The most you can generate at once is " + MAX.toLocaleString() + ".", "note");
    else if (domain !== "gmail.com" && domain !== "googlemail.com")
      showMsg("Dots are only ignored by Gmail. On " + domain + " these may count as different addresses.", "note");
  }

  function reset() {
    wipe();
    state = { email: "", limit: 100, list: [], total: 0 };
    current = [];
    emailEl.value = "";
    limitEl.value = 100;
    $("plus").checked = true;
    clearMsg();
    renderAll();
    emailEl.focus();
  }

  /* ---------- events ---------- */
  $("gen").addEventListener("click", generate);
  $("reset").addEventListener("click", reset);
  moreEl.addEventListener("click", renderMore);
  emailEl.addEventListener("keydown", function (e) { if (e.key === "Enter") generate(); });
  limitEl.addEventListener("keydown", function (e) { if (e.key === "Enter") generate(); });

  // keep what is typed, even before pressing Generate
  function keepInputs() {
    state.email = emailEl.value;
    var n = parseInt(limitEl.value, 10);
    if (n) state.limit = n;
    state.plus = $("plus").checked;
    persist();
  }
  emailEl.addEventListener("input", keepInputs);
  limitEl.addEventListener("input", keepInputs);
  $("plus").addEventListener("change", keepInputs);

  $("copyAll").addEventListener("click", function () {
    var btn = $("copyAll");
    copyText(current.join("\n")).then(function () { flash(btn, "Copied"); }, function () { flash(btn, "Failed"); });
  });

  $("download").addEventListener("click", function () {
    var blob = new Blob([current.join("\n")], { type: "text/plain" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "dot-emails.txt";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 500);
  });

  /* ---------- restore on open / refresh ---------- */
  var saved = load();
  if (saved) {
    state = saved;
    emailEl.value = saved.email || "";
    limitEl.value = saved.limit || 100;
    $("plus").checked = saved.plus !== false;
    current = saved.list || [];
    renderAll();
  }
})();
</script>
</body>
</html>
